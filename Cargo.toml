[package]
name = "openrip"
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Open-source DVD and Blu-ray ripper with a friendly interface, powered by FFmpeg"

[dependencies]
cpal = "0.18.2"
# The lighter OpenGL renderer (glow) instead of wgpu: same look, far less to compile.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libloading = "0.9.0"
rfd = "0.17.2"

[profile.release]
opt-level = 3
