    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f6ff"/><stop offset=".5" stop-color="#9fc2f0"/><stop offset="1" stop-color="#dfe9fb"/>
    </linearGradient>
