name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/openrip dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          if [ "$RUNNER_OS" = Linux ]; then cp packaging/linux/* dist/; fi
          tar -czf openrip-${{ matrix.name }}.tar.gz -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/openrip.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath openrip-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openrip-${{ matrix.name }}
          path: |
            openrip-${{ matrix.name }}.tar.gz
            openrip-${{ matrix.name }}.zip
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openrip-windows-x86_64
          path: app
      - name: Unpack the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Expand-Archive app/openrip-windows-x86_64.zip -DestinationPath dist
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe" dist/
          Copy-Item "$($root.FullName)/bin/ffprobe.exe" dist/
          New-Item -ItemType Directory dist/licenses | Out-Null
          Copy-Item "$($root.FullName)/LICENSE.txt" dist/licenses/FFmpeg-LICENSE.txt
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-libbluray
            mingw-w64-x86_64-libaacs
      - name: Collect libbluray, libaacs and the DLLs they need
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/licenses
          for dll in /mingw64/bin/libbluray-*.dll /mingw64/bin/libaacs-*.dll; do
            cp "$dll" dist/
            # libbluray looks for plain "libaacs.dll", but MSYS2 names it libaacs-0.dll.
            case "$dll" in */libaacs-*.dll) mv "dist/$(basename "$dll")" dist/libaacs.dll ;; esac
            # Every MSYS2 DLL this one needs (Windows' own DLLs live elsewhere and are skipped).
            ldd "$dll" | awk '/\/mingw64\// {print $3}' | sort -u | while read -r dep; do
              cp -n "$dep" dist/
            done
          done
          for pkg in libbluray libaacs libgcrypt libgpg-error libxml2; do
            if [ -d "/mingw64/share/licenses/$pkg" ]; then
              cp -r "/mingw64/share/licenses/$pkg" "dist/licenses/$pkg"
            fi
          done
          ls dist
      - name: Check the folder has everything
        shell: pwsh
        run: |
          foreach ($f in "openrip.exe", "ffmpeg.exe", "ffprobe.exe") {
            if (-not (Test-Path "dist/$f")) { throw "missing $f" }
          }
          if (-not (Get-ChildItem dist -Filter "libbluray*.dll")) { throw "missing libbluray" }
          if (-not (Get-ChildItem dist -Filter "libaacs*.dll")) { throw "missing libaacs" }
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\dist" installer\openrip.iss
      - uses: actions/upload-artifact@v4
        with:
          name: openrip-windows-installer
          path: installer/output/*.exe
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Cargo sources list
        run: |
          pip install aiohttp tomlkit PyYAML
          curl -sSLf -o /tmp/fcg.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/fcg.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenRip.flatpak
          upload-artifact: false
          manifest-path: packaging/flatpak/io.github.adamwrose.OpenRip.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - run: mv OpenRip.flatpak openrip-linux-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: openrip-flatpak
          path: openrip-linux-x86_64.flatpak
          if-no-files-found: error

  arch-package:
    name: Arch package
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust pkgconf alsa-lib
      - uses: actions/checkout@v4
      - name: Build the package from this commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          useradd -m builder
          mkdir /home/builder/pkg
          git archive --prefix="openrip-$ver/" HEAD | gzip > "/home/builder/pkg/openrip-$ver.tar.gz"
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          cd /home/builder/pkg
          # Build from the tarball of this exact commit rather than the published tag.
          sed -i -e "s/^pkgver=.*/pkgver=$ver/" \
                 -e "s|^source=.*|source=(\"openrip-$ver.tar.gz\")|" \
                 -e "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD
          chown -R builder:builder /home/builder/pkg
          su builder -c "cd ~/pkg && makepkg -f --nodeps"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /home/builder/pkg/*.pkg.tar.zst "$GITHUB_WORKSPACE/out/openrip-linux-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: openrip-arch-package
          path: out/openrip-linux-x86_64.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-installer, flatpak, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
